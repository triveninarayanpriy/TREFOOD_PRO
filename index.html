<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>TreFood | Hyperlocal Campus Delivery for NIT Patna</title>
    <meta
      name="description"
      content="Hyperlocal campus delivery for NIT Patna. Order food, fruits, groceries and raw chicken. Zero delivery fee, pay at gate, curfew-aware 4-digit code matching."
    />
    <meta name="theme-color" content="#830020" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TreFood NIT Patna" />
    <meta property="og:title" content="TreFood | NIT Patna Campus Delivery" />
    <meta
      property="og:description"
      content="Order meals, snacks, fruits, groceries, and raw chicken at NIT Patna. Zero delivery fee, pay at gate, 4-digit handover code verification."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://trefood-prototype.technicaltriveniyt.workers.dev/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TreFood | NIT Patna Campus Delivery" />
    <meta
      name="twitter:description"
      content="Zero delivery fee, pay at the hostel gate, 4-digit packet code verification."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- JSON-LD Structured Data (Organization & LocalBusiness) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "TreFood",
            "url": "https://trefood-prototype.technicaltriveniyt.workers.dev",
            "logo": "https://trefood-prototype.technicaltriveniyt.workers.dev/icon-512.png",
            "description": "Hyperlocal campus delivery platform for NIT Patna.",
            "areaServed": {
              "@type": "EducationalOrganization",
              "name": "National Institute of Technology Patna"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "support@trefood.in"
            }
          },
          {
            "@type": "LocalBusiness",
            "name": "TreFood NIT Patna",
            "url": "https://trefood-prototype.technicaltriveniyt.workers.dev",
            "image": "https://trefood-prototype.technicaltriveniyt.workers.dev/og-image.png",
            "priceRange": "₹0 Delivery Fee",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Ashok Rajpath, Mahendru",
              "addressLocality": "Patna",
              "addressRegion": "BR",
              "postalCode": "800005",
              "addressCountry": "IN"
            },
            "openingHoursSpecification": [
              {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
                "opens": "00:00",
                "closes": "23:59"
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body class="min-h-screen bg-[var(--color-surface-sunken)] text-[var(--color-text)] antialiased selection:bg-amber-200 selection:text-stone-950">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
